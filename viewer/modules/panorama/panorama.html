<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 image viewer</title>
    <link rel="stylesheet" href="/viewer/shared/oswald_font.css">
    <link rel="stylesheet" href="pannellum.css">
    <link rel="stylesheet" href="/viewer/shared/shared_styles.css">
    <link rel="stylesheet" href="/viewer/shared/guide.css">
    <style>
        html,
        body,
        #panorama {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #ZoomIn,
        #ZoomOut,
        #ResetView,
        #CompassToggle {
            width: 30px;
            height: 30px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 100%;
        }

        #ZoomIn {
            background-image: url("https://data.dh.gu.se/ui-icons/zoomin_big_white.png");
        }

        #ZoomOut {
            background-image: url("https://data.dh.gu.se/ui-icons/zoomout_big_white.png");
        }

        #ResetView {
            background-image: url("/viewer/shared/interface/frame.png");
        }

        #CompassToggle {
            background-image: url("/viewer/shared/interface/compass.svg");
        }

        #CompassToggle.compass-hidden {
            opacity: 0.45;
        }

        .pnlm-compass.compass-hidden {
            display: none !important;
        }

        .toolbar-bottom {
            align-items: center;
        }

        #PanoramaSwitcher {
            position: absolute;
            z-index: 10;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 70px;
            height: 30px;
            padding: 3px 35px 5px 10px;
            color: white;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.9);
            background-image: url("/viewer/shared/dropdown-arrow.png");
            background-position: calc(100% - 10px) 55%;
            background-repeat: no-repeat;
            background-size: 15px;
            border: 0;
            border-radius: 6px;
            box-shadow: 0 0.1rem 1rem rgba(0, 0, 0, 0.3);
            font-family: "Oswald", sans-serif;
            font-size: 14px;
            font-weight: 200;
            user-select: none;
            -webkit-appearance: none;
            -webkit-user-select: none;
        }

        body.has-ui-module #PanoramaSwitcher {
            top: 80px;
        }

        #PanoramaSwitcher:focus {
            outline: none;
        }

        .toolbar-bottom .NavButton {
            margin: 0 6px;
            opacity: 0.8;
        }

        .toolbar-bottom .NavButton:hover {
            opacity: 1;
        }

        .pnlm-compass {
            top: 4px;
            bottom: auto;
        }
    </style>
</head>

<body>
    <div id="guide" onclick="hidePanoramaGuide();">
        <div class="guide-content">
            <div class="guide-instructions">
                <div class="guide-instructions-intro">
                    Click and drag to look around. Scroll to zoom in and out.
                </div>
                <div id="guide-instructions-tools">
                    <h2>Tools</h2>
                    <div class="guide-instructions-item">
                        <div class="guide-instructions-item-icon"
                            style="background-image:url(/viewer/shared/interface/frame.png)"></div>
                        <div class="guide-instructions-item-label"><b>Reset View.</b> Return to the initial
                            position and zoom level.</div>
                    </div>
                    <div class="guide-instructions-item">
                        <div class="guide-instructions-item-icon"
                            style="background-image:url(https://data.dh.gu.se/ui-icons/zoomin_big_white.png)"></div>
                        <div class="guide-instructions-item-label"><b>Zoom Controls.</b> Zoom in and out.
                        </div>
                    </div>
                    <div class="guide-instructions-item">
                        <div class="guide-instructions-item-icon"
                            style="background-image:url(/viewer/shared/interface/compass.svg)"></div>
                        <div class="guide-instructions-item-label"><b>Compass.</b> Show or hide the direction compass.
                        </div>
                    </div>
                    <div class="guide-instructions-item">
                        <div class="guide-instructions-item-icon full-page"></div>
                        <div class="guide-instructions-item-label"><b>Full Page.</b> Expand or restore the panorama
                            viewer.</div>
                    </div>
                    <div class="guide-closer">Close</div>
                </div>
            </div>
        </div>
    </div>
    <div id="panorama"></div>
    <select id="PanoramaSwitcher" title="Select panorama"></select>
    <div class="interface-area">
        <div class="toolbar-bottom">
            <div id="ResetView" class="NavButton" title="Reset view"></div>
            <div id="ZoomIn" class="NavButton" title="Zoom in"></div>
            <div id="ZoomOut" class="NavButton" title="Zoom out"></div>
            <div id="CompassToggle" class="NavButton" title="Toggle compass"></div>
            <div id="FullPage" class="NavButton full-page" title="Toggle full page"></div>
        </div>
        <div class="guide-button compact" title="User Guide" onclick="showPanoramaGuide();">?</div>
        <a id="download">
            <div class="round-button download-button compact deactivated" title="Download panorama"></div>
        </a>
    </div>
    <script src="pannellum.js"></script>
    <script>
        const panoramaConfig = 'PLACEHOLDER_PANORAMA_CONFIG';
        const panoramas = panoramaConfig.panoramas;
        const scenes = Object.fromEntries(panoramas.map(({ id, title, downloadUrl, startPos, northOffset = 0, urlPublic }) => {
            const [yaw, pitch, hfov] = startPos;
            return [id, {
                type: 'multires',
                yaw,
                pitch,
                hfov,
                northOffset,
                multiRes: {
                    basePath: urlPublic.replace(/\/$/, ''),
                    path: '/%l/%s%y_%x',
                    fallbackPath: '/fallback/%s',
                    extension: 'jpg',
                    tileResolution: 512,
                    maxLevel: 5,
                    cubeResolution: 6456
                }
            }];
        }));

        const viewer = pannellum.viewer('panorama', {
            default: { firstScene: panoramaConfig.initialScene || panoramas[0].id },
            scenes,
            autoLoad: true,
            compass: true,
            showFullscreenCtrl: false,
            showZoomCtrl: false
        });

        const panoramaSwitcher = document.getElementById('PanoramaSwitcher');

        function updateSwitcherPosition() {
            const uiModule = window.parent.document.querySelector('.ui-module');
            const isVisible = uiModule && window.parent.getComputedStyle(uiModule).display !== 'none';
            document.body.classList.toggle('has-ui-module', isVisible);
        }

        updateSwitcherPosition();

        panoramas.forEach(({ id, title }) => panoramaSwitcher.add(new Option(title, id)));
        panoramaSwitcher.value = panoramaConfig.initialScene || panoramas[0].id;
        panoramaSwitcher.hidden = panoramas.length < 2;

        function updateDownload(panorama) {
            const download = document.getElementById('download');
            const button = download.querySelector('.download-button');
            if (panorama.downloadUrl) {
                download.href = panorama.downloadUrl;
                button.classList.remove('deactivated');
            } else {
                download.removeAttribute('href');
                button.classList.add('deactivated');
            }
        }

        updateDownload(panoramas.find(({ id }) => id === panoramaSwitcher.value));

        panoramaSwitcher.onchange = () => {
            viewer.loadScene(
                panoramaSwitcher.value,
                viewer.getPitch(),
                viewer.getYaw(),
                viewer.getHfov()
            );
            const panorama = panoramas.find(({ id }) => id === panoramaSwitcher.value);
            updateDownload(panorama);
            window.parent.postMessage({ type: 'panoramaChange', id: panorama.id }, '*');
        };

        function showPanoramaGuide() {
            document.getElementById('guide').style.pointerEvents = 'auto';
            document.getElementById('guide').style.opacity = '1';
            document.getElementById('guide-instructions-tools').style.transform = 'scale(1)';
        }

        function hidePanoramaGuide() {
            document.getElementById('guide').style.pointerEvents = 'none';
            document.getElementById('guide').style.opacity = '0';
            document.getElementById('guide-instructions-tools').style.transform = 'scale(0.5)';
        }

        document.getElementById('ResetView').onclick = () => {
            const { startPos } = panoramas.find(({ id }) => id === viewer.getScene());
            viewer.setYaw(startPos[0]);
            viewer.setPitch(startPos[1]);
            viewer.setHfov(startPos[2]);
        };

        document.getElementById('ZoomIn').onclick = () => viewer.setHfov(viewer.getHfov() - 20);
        document.getElementById('ZoomOut').onclick = () => viewer.setHfov(viewer.getHfov() + 20);
        document.getElementById('CompassToggle').onclick = function () {
            const compass = document.querySelector('.pnlm-compass');
            const hidden = compass.classList.toggle('compass-hidden');
            this.classList.toggle('compass-hidden', hidden);
        };

        document.getElementById('FullPage').onclick = function () {
            this.classList.toggle('full-page-active');
            window.parent.postMessage({ type: 'togglePane' }, '*');
        };
    </script>
</body>

</html>
