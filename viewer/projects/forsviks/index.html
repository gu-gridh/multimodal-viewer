<!DOCTYPE html>
<html lang="en" data-project="forsviks">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forsviks</title>
    <link rel="icon" href="https://data.dh.gu.se/ui-icons/gridh_favicon/favicon.ico">
    <link rel="stylesheet" href="/viewer/shared/oswald_font.css">
    <link rel="stylesheet" href="/viewer/shared/shared_styles.css">
    <link rel="stylesheet" href="/viewer/shared/split-layout.css">
    <script src="/viewer/modules/pointcloud/libs/jquery/jquery-3.1.1.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--viewer-bg);
        }

        #left-pane {
            width: calc(100% - 450px);
            position: relative;
        }

        #right-pane {
            position: relative;
            width: 450px;
            background: #e9dcd1;
        }

        #right-Iframe {
            position: absolute;
            top: 0;
            right: 0;
            width: 450px;
            min-width: 450px;
            pointer-events: auto;
            transition: transform 450ms cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        .iframes {
            width: 100%;
            border: 0;
            display: block;
        }

        #footer-container #footer {
            background-color: #9b4631 !important;
            color: white !important;
        }

        #footer-container #footer * {
            color: white !important;
        }

        @media (min-width: 1051px) {

            #left-pane,
            #right-pane {
                flex-shrink: 0;
                transition: width 450ms cubic-bezier(0.22, 1, 0.36, 1);
            }

            #main-content.panel-hidden #left-pane {
                width: 100%;
            }

            #main-content.panel-hidden #right-pane {
                width: 0;
            }

            #main-content.panel-hidden #right-Iframe {
                transform: translateX(100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            #main-content #left-pane,
            #main-content #right-pane,
            #main-content.panel-hidden #right-pane,
            #right-Iframe {
                transition: none;
            }
        }

        @media (max-width: 1050px) {
            #left-pane {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main id="main-content">
        <div id="left-pane">
            <iframe id="left-Iframe" class="iframes" title="Forsviks visualisation"></iframe>
        </div>
        <aside id="right-pane">
            <iframe id="right-Iframe" class="iframes" title="About this area"
                src="/viewer/projects/forsviks/metadata/metadata.html"></iframe>
        </aside>
        <div id="footer-container"></div>
    </main>
    <script>
        const modules = {
            image: 'iiif',
            pointcloud: 'pointcloud',
            texturedmesh: 'texturedmesh',
            panorama: 'panorama'
        };
        const layout = document.getElementById('main-content');
        const viewer = document.getElementById('left-Iframe');
        const metadata = document.getElementById('right-Iframe');
        let article;

        function showModule(module, area) {
            const viewerModule = modules[module];
            if (!viewerModule) {
                viewer.src = 'about:blank';
                return;
            }
            const url = new URL(window.location.href);
            const routeName = viewerModule === 'iiif' ? 'image' : viewerModule;
            url.searchParams.set('q', `${area}/${routeName}`);
            const query = new URLSearchParams(url.searchParams);
            viewer.src = `/viewer/modules/${viewerModule}/${viewerModule}.html?${query}${url.hash}`;
            window.history.replaceState({}, '', url.href.replace(/%2F/gi, '/'));
        }

        function updateMetadata() {
            if (article) metadata.contentWindow?.postMessage({ type: 'articleData', article }, window.location.origin);
        }

        async function loadFromUrl() {
            const query = new URLSearchParams(window.location.search).get('q') || '1';
            const [area, requestedType] = query.split('/');
            const response = await fetch(`/api/article-info?id=${encodeURIComponent(area)}`);
            if (!response.ok) throw new Error('Unable to load article');
            article = await response.json();
            updateMetadata();
            showModule(requestedType?.trim().toLowerCase() || 'image', area);
        }

        $('#footer-container').load('/viewer/projects/forsviks/footer.html');
        metadata.addEventListener('load', updateMetadata);
        window.addEventListener('popstate', () => loadFromUrl().catch(console.error));
        window.addEventListener('message', event => {
            if (event.origin !== window.location.origin || event.source !== viewer.contentWindow) return;
            if (['togglePane', 'togglePane2'].includes(event.data?.type) && window.innerWidth > 1050) {
                const expanded = layout.classList.toggle('panel-hidden');
                viewer.contentWindow.setPointcloudExpanded?.(expanded);
            }
            if (event.data?.type === 'panoramaChange') {
                const url = new URL(window.location.href);
                url.searchParams.set('id', event.data.id);
                window.history.replaceState({}, '', url.href.replace(/%2F/gi, '/'));
            }
        });
        loadFromUrl().catch(console.error);
    </script>
</body>

</html>
