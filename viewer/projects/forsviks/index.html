<!DOCTYPE html>
<html lang="en" data-project="forsviks">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forsviks</title>
    <link rel="icon" href="https://data.dh.gu.se/ui-icons/gridh_favicon/favicon.ico">
    <link rel="stylesheet" href="/viewer/shared/oswald_font.css">
    <link rel="stylesheet" href="/viewer/shared/shared_styles.css">
    <link rel="stylesheet" href="/viewer/shared/split-layout.css">
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--viewer-bg);
        }

        #main-content {
            height: 100% !important;
        }

        #left-pane {
            width: calc(100% - 420px);
            position: relative;
        }

        #right-pane {
            width: 420px;
            position: relative;
            background: #f5f5f5;
        }

        .iframes {
            width: 100%;
            border: 0;
            display: block;
        }

        .ui-module {
            display: flex;
            white-space: nowrap;
        }

        .ui-module button {
            border: 0;
            background: transparent;
            font: inherit;
        }

        .ui-module button.active {
            opacity: 1;
        }

        @media (min-width: 1051px) {

            #left-pane,
            #right-pane {
                flex-shrink: 0;
                transition: width 250ms ease-out;
            }

            #main-content.panel-hidden #left-pane {
                width: 100%;
            }

            #main-content.panel-hidden #right-pane {
                visibility: hidden;
                transition: visibility 0s 250ms;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            #main-content #left-pane,
            #main-content #right-pane,
            #main-content.panel-hidden #right-pane {
                transition: none;
            }
        }

        @media (max-width: 1050px) {
            #left-pane {
                width: 100%;
            }

            #main-content.show-about #left-pane {
                display: none;
            }

            #main-content.show-about #right-pane {
                display: block;
                width: 100%;
            }

            #back-to-visuals {
                display: block;
                position: absolute;
                top: 12px;
                left: 20px;
                border: 0;
            }
        }

        .back-button {
            position: absolute;
            top: 28px;
            left: 30px;
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            background: black url(https://data.dh.gu.se/ui-icons/arrow_back_white.png) center / 15px no-repeat;
            z-index: 1000;
        }

        @media (max-width: 600px) {
            .back-button {
                left: 12px;
                width: 30px;
                height: 30px;
            }

            .ui-module {
                top: 70px;
            }
        }
    </style>
</head>

<body>
    <main id="main-content">
        <div id="left-pane">
            <button class="back-button" title="Go back" disabled></button>
            <div class="ui-module-container">
                <nav class="ui-module">
                    <button class="ui-module-item" data-module="pointcloud">Pointcloud</button>
                    <button class="ui-module-item" data-module="texturedmesh">Mesh</button>
                    <button class="ui-module-item" data-module="panorama">Panorama</button>
                    <button class="ui-module-item compact" id="about-button">About</button>
                </nav>
            </div>
            <iframe id="left-Iframe" class="iframes" title="Forsviks documentation"></iframe>
        </div>
        <aside id="right-pane">
            <button id="back-to-visuals" class="theme-button">Back to visuals</button>
            <iframe id="right-Iframe" class="iframes" title="About this area"
                src="/viewer/projects/forsviks/metadata/metadata.html"></iframe>
        </aside>
    </main>
    <script>
        const modules = ['pointcloud', 'texturedmesh', 'panorama'];
        const layout = document.getElementById('main-content');
        const viewer = document.getElementById('left-Iframe');

        function showModule(module, updateHistory = true) {
            if (!modules.includes(module)) module = 'pointcloud';
            const url = new URL(window.location.href);
            const area = (url.searchParams.get('q') || '1').split('/')[0];
            url.searchParams.set('q', `${area}/${module}`);
            const query = new URLSearchParams(url.searchParams);
            viewer.src = `/viewer/modules/${module}/${module}.html?${query}${url.hash}`;
            document.querySelectorAll('[data-module]').forEach(button => {
                button.classList.toggle('active', button.dataset.module === module);
            });
            layout.classList.remove('show-about');
            window.history[updateHistory ? 'pushState' : 'replaceState']({}, '', url.href.replace(/%2F/gi, '/'));
        }

        function loadFromUrl() {
            showModule(new URLSearchParams(window.location.search).get('q')?.split('/')[1], false);
        }

        document.querySelectorAll('[data-module]').forEach(button => {
            button.addEventListener('click', () => showModule(button.dataset.module));
        });
        document.getElementById('about-button').onclick = () => layout.classList.add('show-about');
        document.getElementById('back-to-visuals').onclick = () => layout.classList.remove('show-about');
        window.addEventListener('popstate', loadFromUrl);
        window.addEventListener('message', event => {
            if (event.origin !== window.location.origin || event.source !== viewer.contentWindow) return;
            if (['togglePane', 'togglePane2'].includes(event.data?.type) && window.innerWidth > 1050) {
                layout.classList.toggle('panel-hidden');
            }
            if (event.data?.type === 'panoramaChange') {
                const url = new URL(window.location.href);
                url.searchParams.set('id', event.data.id);
                window.history.replaceState({}, '', url.href.replace(/%2F/gi, '/'));
            }
        });
        loadFromUrl();
    </script>
</body>

</html>
