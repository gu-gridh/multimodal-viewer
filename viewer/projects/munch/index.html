<!DOCTYPE html>
<html data-project="munch">

<head>
    <title>Munch Multimodal Tool</title>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="author" content="">
    <link href="/viewer/shared/barlow_font.css" rel="stylesheet">
    <link href="/viewer/shared/oswald_font.css" rel="stylesheet">
    <script src="/viewer/modules/pointcloud/libs/jquery/jquery-3.1.1.min.js"></script>
    <link rel="stylesheet" href="/viewer/shared/shared_styles.css">
    <link rel="stylesheet" href="/viewer/shared/split-layout.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        html,
        body {
            top: 0;
            height: 100% !important;
            width: 100vw;
            margin: 0 !important;
            overflow: hidden !important;
            font-family: "Oswald", sans-serif !important;
            -ms-overflow-style: none;
            font-size: 108% !important;
            background-color: var(--viewer-bg) !important;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            height: 100%;
            display: flex;
        }

        #left-pane,
        #right-pane {
            height: 100%;
        }

        #left-pane {
            width: 70%;
        }

        #right-pane {
            width: 30%;
            background-color: rgb(236, 232, 226);
        }

        .mobile-panel-toggle,
        .mobile-panel-header {
            display: none;
        }

        .mobile-panel-toggle {
            border: 0;
            background: transparent;
            font: inherit;
        }

        #back-to-visuals {
            display: block;
            position: static;
            border: 0;
            background-image: url(https://data.dh.gu.se/ui-icons/arrow_back_white.png);
            background-size: 15px;
            background-position: center;
            background-repeat: no-repeat;
        }

        .iframes {
            border: none;
        }

        /* Override for split-layout defaults so the switch to compact can be at 950 instead of 1050 */
        @media screen and (max-width: 1050px) {

            #main-content {
                height: calc(100% - 80px) !important;
            }

            #right-pane {
                display: block;
            }

            #footer-container {
                display: block;
            }
        }

        /* Small screen adaption */
        @media screen and (max-width: 950px) {
            #main-content {
                height: 100% !important;
            }

            #left-pane,
            #right-pane {
                width: 100% !important;
            }

            .mobile-panel-toggle,
            .mobile-panel-header {
                display: block;
            }

            #right-pane,
            .mobile-metadata-open #left-pane {
                display: none;
            }

            .mobile-metadata-open #right-pane {
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
            }

            .mobile-panel-header {
                padding: 12px;
                background-color: #fafafa;
            }

            #footer-container {
                display: none;
            }

        }
    </style>
</head>

<body>
    <div id="main-content">
        <div id="left-pane">
            <div class="ui-module-container">
                <div class="ui-module">
                    <div class="ui-module-item left orthophoto" id="btn1"
                        onclick="changeLeftViewer('photo'); moduleSwitcherLeft(1);" style="opacity:1.0;"></div>
                    <div class="ui-module-item left" id="btn2"
                        onclick="changeLeftViewer('topography'); moduleSwitcherLeft(2);">
                    </div>
                    <div class="ui-module-item left" id="btn3"
                        onclick="changeLeftViewer('mesh'); moduleSwitcherLeft(3);">
                    </div>
                    <button type="button" class="ui-module-item left mobile-panel-toggle" id="btn4"
                        onclick="showMobileMetadata(true)">About</button>
                </div>
            </div>
            <iframe id="left-Iframe" class="iframes" style="width:100%;"></iframe>
        </div>
        <div id="right-pane">
            <div class="mobile-panel-header">
                <button type="button" id="back-to-visuals" class="round-button" title="Back to visuals"
                    onclick="showMobileMetadata(false)"></button>
            </div>
            <iframe id="right-iframe" class="iframes" style="width:100%;"></iframe>
        </div>
        <div id="footer-container"></div>
    </div>

    <script>
        let activeLeftViewer = 'photo';

        $(document).ready(function () {
            const urlParams = new URLSearchParams(window.location.search);
            const viewerType = determineInitialViewer(urlParams);
            changeLeftViewer(viewerType);
            changeRightViewer('metadata');
            $("#footer-container").load("/viewer/projects/munch/footer.html");
            applyLabels();
        });

        window.addEventListener('message', function (event) {
            if (event.data.type === 'togglePane') {
                toggleRightPane();
            }
        }, false);

        function determineInitialViewer(params) {
            const qValue = params.get('q');
            if (qValue) {
                const segments = qValue.split('/');
                if (segments.length > 1) {
                    switch (segments[1]) {
                        case 'mesh':
                            return 'mesh';
                        case 'topography':
                            return 'topography';
                        case 'photo':
                            return 'photo';
                        case 'iiif':
                            return 'photo';
                        default:
                            return 'photo';
                    }
                }
            }
            return 'photo';
        }

        function applyLabels() {
            document.getElementById('btn1').textContent = 'Photo';
            document.getElementById('btn2').textContent = 'Topography';
            document.getElementById('btn3').textContent = 'Mesh';
        }

        function getBaseQuery() {
            const queryString = window.location.search;
            const params = new URLSearchParams(queryString);
            let qValue = params.get('q') || '';

            if (qValue.includes('/')) {
                qValue = qValue.split('/')[0];
            }

            return qValue;
        }

        function changeLeftViewer(viewerType) {
            activeLeftViewer = viewerType;
            const iframe = document.getElementById('left-Iframe');
            const queryString = window.location.search;
            const currentUrl = new URL(window.location.href);
            const hashFragment = currentUrl.hash || '';
            const qValue = getBaseQuery();
            const filterQuery = window.getAnnotationFilterQuery?.();
            const filterSuffix = filterQuery ? `&${filterQuery}` : '';
            let src = '';
            let newPath = `/viewer/?q=${qValue}`;
            let buttonNum = 1;

            switch (viewerType) {
                case 'topography':
                    src = `/viewer/modules/iiif/iiif.html?q=${qValue}/topography${filterSuffix}${hashFragment}`;
                    newPath = `/viewer/?q=${qValue}/topography`;
                    buttonNum = 2;
                    break;
                case 'mesh':
                    src = `/viewer/modules/mesh/mesh.html${queryString}`;
                    newPath = `/viewer/?q=${qValue}/mesh`;
                    buttonNum = 3;
                    break;
                case 'photo':
                default:
                    src = `/viewer/modules/iiif/iiif.html?q=${qValue}/photo${filterSuffix}${hashFragment}`;
                    newPath = `/viewer/?q=${qValue}/photo`;
                    buttonNum = 1;
                    break;
            }

            iframe.src = src;
            moduleSwitcherLeft(buttonNum);
            window.history.replaceState({}, '', newPath);
        }

        function changeRightViewer(viewerType) {
            const iframe = document.getElementById('right-iframe');
            const qValue = getBaseQuery();

            if (viewerType === 'metadata') {
                const metadataUrl = `/viewer/projects/munch/metadata/metadata.html?q=${qValue}`;
                const currentSrc = iframe.getAttribute('src');

                if (currentSrc !== metadataUrl) {
                    iframe.src = metadataUrl;
                }
            }
        }

        function showMobileMetadata(open) {
            document.getElementById('main-content').classList.toggle('mobile-metadata-open', open);
            document.getElementById(open ? 'back-to-visuals' : 'btn4').focus();
        }

        function toggleRightPane() {
            var leftPane = document.getElementById('left-pane');
            var rightPane = document.getElementById('right-pane');
            if (rightPane.style.width === '0px') {
                rightPane.style.width = '30%';
                leftPane.style.width = '70%';
            } else {
                rightPane.style.width = '0px';
                leftPane.style.width = '100%';
            }
        }

        function moduleSwitcherLeft(num) {
            $('.left').css('opacity', '0.6');
            $('#btn' + num).css('opacity', '1.0');
        }
    </script>
    <script data-annotation-only>
        let activeAnnotationFilters = {};

        window.addEventListener('message', event => {
            if (event.data.type === 'annotationFiltersChange') {
                activeAnnotationFilters = event.data.filters || {};
                sendActiveAnnotationFilters();
            } else if (event.data.type === 'iiifViewerReady') {
                sendActiveAnnotationFilters();
            } else if (event.data.type === 'annotationClick' || event.data.type === 'annotationLoaded') {
                document.getElementById('right-iframe').contentWindow.postMessage({
                    type: 'annotationSelectionChange',
                    value: event.data.value
                }, '*');
            }
        });

        function sendActiveAnnotationFilters() {
            if (!['photo', 'topography'].includes(activeLeftViewer)) {
                return;
            }

            document.getElementById('left-Iframe').contentWindow.postMessage({
                type: 'annotationFiltersChange',
                filters: activeAnnotationFilters
            }, '*');
        }

        function getAnnotationFilterQuery() {
            const params = new URLSearchParams();
            Object.entries(activeAnnotationFilters).forEach(([key, value]) => {
                if (value && value !== 'all') {
                    params.set(key, value);
                }
            });

            return params.toString();
        }
    </script>
    <!-- Matomo -->
    <script>
        var _paq = window._paq = window._paq || [];
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function () {
            var u = "MATOMO_URL_PLACEHOLDER".replace(/\/?$/, '/');
            _paq.push(['setTrackerUrl', u + 'matomo.php']);
            _paq.push(['setSiteId', 'MATOMO_ID_PLACEHOLDER']);
            var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
            g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
        })();
    </script>
</body>

</html>
