<!DOCTYPE html>
<html lang="sv" data-project="runes">

<head>
    <title>Runstenar</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="/viewer/shared/barlow_font.css" rel="stylesheet">
    <link href="/viewer/shared/oswald_font.css" rel="stylesheet">
    <link href="/viewer/shared/teko_font.css" rel="stylesheet">
    <link rel="stylesheet" href="/viewer/shared/shared_styles.css">
    <link rel="stylesheet" href="/viewer/shared/split-layout.css">
    <link rel="stylesheet" href="/viewer/projects/runes/style.css">
    <script src="/viewer/modules/pointcloud/libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/venn.js@0.2.20/build/venn.js"></script> 
    <script src="/viewer/projects/runes/helpers/drawVenn.js"></script>  

</head>

<body>
    <div id="main-content">
        <div id="left-pane">
            <div class="ui-module-container">
                <div class="ui-module">
                    <div class="ui-module-item left" id="region-west" onclick="changeRegion('vastra')">Västergötland
                    </div>
                    <div class="ui-module-item left" id="region-east" onclick="changeRegion('ostra')">Östergötland
                    </div>
                    <div class="ui-module-item left mobile-metadata-tab" onclick="showMobileMetadata()">About</div>
                </div>
            </div>
            <div id="left-placeholder" class="module-placeholder">
                <div class="venn-panel">
                    <div id="venn-diagram"></div>
                </div>
            </div>
            <iframe id="left-iframe" class="iframes" title="Region"></iframe>
            <div class="period-switcher">
                <div class="ui-module">
                    <div class="ui-module-item period" id="period-1" onclick="changePeriod('1')">Period 1</div>
                    <div class="ui-module-item period" id="period-2" onclick="changePeriod('2')">Period 2</div>
                </div>
            </div>
        </div>

        <div id="right-pane">
            <div class="mobile-back-button" title="Back to visuals" onclick="showMobileVisuals()"></div>
            <div class="ui-module-container">
                <div class="ui-module" id="nav-bar">
                    <div class="ui-module-item right" id="viewer-metadata" onclick="changeRightViewer('metadata')">
                        Metadata
                    </div>
                     <div class="ui-module-item right" id="viewer-images" onclick="changeRightViewer('images')" style="display: none;">
                        Bild
                    </div>
                     <div class="ui-module-item right" id="viewer-texturedmesh" onclick="changeRightViewer('texturedmesh')">
                        Modell
                    </div>
                    <div class="ui-module-item right" id="viewer-panorama" onclick="changeRightViewer('panorama')">
                        Kontext
                    </div>
                   
                    
                </div>
            </div>
            <iframe id="right-iframe" class="iframes" title="Rune content"></iframe>
            <div id="right-placeholder" class="module-placeholder"></div>
        </div>
        <div id="footer-container"></div>
    </div>

    <script>
        let activeRegion = 'vastra';
        let activeViewer = 'metadata';
        let activePeriod = '1';

        let vennData = null;

        const STONE_COLORS = {
            normal: '#ffaa00',
            unknown: '#999', //change this?
            selected: '#c43a04'
        };

        async function init() {
            const params = new URLSearchParams(window.location.search);

            const region = params.get('region');

            activeRegion = ['vastra', 'ostra'].includes(region)
                ? region
                : activeRegion;

            activeViewer = determineInitialViewer(params);

            const qValue = params.get('q');
            const runeId = qValue?.split('/')[0];

            if (runeId && activeViewer === 'metadata') {
            document
                .getElementById('main-content')
                .classList.add('mobile-metadata-open');
        }

            const navBar = document.getElementById('nav-bar');
            navBar.style.display = runeId ? '' : 'none';

            //load footer
            try {
                const footerResponse = await fetch(
                    '/viewer/projects/runes/footer.html'
                );
                const footerHtml = await footerResponse.text();
                document.getElementById('footer-container').innerHTML =
                    footerHtml;
            } catch (error) {
                console.error('Could not load footer:', error);
            }

            // Load Venn data
            try {
                const response = await fetch('https://runes.dh.gu.se/api/venn/');

                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }

                vennData = await response.json();

            } catch (error) {
                console.error('Error loading Venn data:', error);
            }

            await updateViewerAvailability(runeId);

            changeLeftViewer();
            changeRightViewer(activeViewer);
        }

        init();

        function changeRegion(region) {
            activeRegion = region;
            changeLeftViewer();
        }

        function showMobileMetadata() {
            changeRightViewer('metadata');
            document.getElementById('main-content').classList.add('mobile-metadata-open');
        }

        function showMobileVisuals() {
            document.getElementById('main-content').classList.remove('mobile-metadata-open');
        }

        function determineInitialViewer(params) {
            const viewerType = params.get('q')?.split('/')[1];

            switch (viewerType) {
                case 'images':
                case 'texturedmesh':
                case 'panorama':
                case 'metadata':
                    return viewerType;
                default:
                    return 'metadata';
            }
        }

        function changeRightViewer(viewerType) {
            const iframe = document.getElementById('right-iframe');
            const params = new URLSearchParams(window.location.search);
            const hashFragment = window.location.hash;
            let qValue = params.get('q') || '';

            if (qValue.includes('/')) {
                qValue = qValue.split('/')[0];
            }

            let src;
            let newPath;
            switch (viewerType) {
                case 'images':
                    src = `/viewer/modules/iiif/iiif.html?q=${qValue}/images${hashFragment}`;
                    newPath = `/viewer/?q=${qValue}/images${hashFragment}`;
                    break;
                case 'texturedmesh':
                    src = `/viewer/modules/texturedmesh/texturedmesh.html?q=${qValue}/texturedmesh${hashFragment}`;
                    newPath = `/viewer/?q=${qValue}/texturedmesh${hashFragment}`;
                    break;
                case 'panorama':
                    src = `/viewer/modules/panorama/panorama.html?q=${qValue}/panorama${hashFragment}`;
                    newPath = `/viewer/?q=${qValue}/panorama${hashFragment}`;
                    break;
                default:
                    src = qValue ? `/viewer/projects/runes/metadata/metadata.html?q=${qValue}` : `/viewer/projects/runes/metadata/metadata.html`;
                    newPath =  qValue ? `/viewer/?q=${qValue}/metadata` : `/viewer/`;
                    viewerType = 'metadata';
            }

            activeViewer = viewerType;
            iframe.src = src;
            iframe.style.display = 'block';
            document.getElementById('right-placeholder').style.display = 'none';
            window.history.pushState({}, '', newPath);
            moduleSwitcherRight();
        }

        //listens for messages from metadata.html
        window.addEventListener('message', function (event) {
            if (event.data.type === 'togglePane') {
                toggleLeftPane();
            }
            if (event.data.type === 'clearSelectedRunestone') {
                clearSelectedRunestone();
            }
            if (event.data.type === 'meshAvailability') {
                const modelButton = document.getElementById('viewer-texturedmesh');
                //hide button
                modelButton.style.display =
                    event.data.hasMesh ? '' : 'none';
            }
            if (event.data.type === 'imageAvailability') {
                const imageButton =
                    document.getElementById('viewer-images');
                //hide button
                imageButton.style.display =
                    event.data.hasImages ? '' : 'none';
            }
        }, false);

        function toggleLeftPane() {
            const leftPane = document.getElementById('left-pane');
            const rightPane = document.getElementById('right-pane');
            const uiModuleContainer = leftPane.querySelector('.ui-module-container');

            if (leftPane.style.width === '1px') {
                leftPane.style.width = '50%';
                rightPane.style.width = '50%';
                if (uiModuleContainer) uiModuleContainer.style.display = 'flex';
            } else {
                leftPane.style.width = '1px';
                rightPane.style.width = '100%';
                if (uiModuleContainer) uiModuleContainer.style.display = 'none';
            }
        }

        function changePeriod(period) {
            activePeriod = period;
            changeLeftViewer();
        }

        //helper to check if point is in the circle
        function pointInsideCircle(x, y, circle) {
            const dx = x - circle.x;
            const dy = y - circle.y;

            return Math.sqrt(dx * dx + dy * dy) < circle.r;
        }
        //then check if the point is in the required circle-sets
        function pointMatchesSets(x, y, requiredSets, circles) {
            const margin = 14; //margin to avoid points being too close to the edge of the circle
            return Object.entries(circles).every(([name, circle]) => {
                const dx = x - circle.x;
                const dy = y - circle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                const required = requiredSets.includes(name);

                if (required) {
                    return distance < circle.r - margin;
                } else {
                    return distance > circle.r + margin;
                }
            });
        }

        //then find a position that matches the required sets
        function findPosition(sets, circles, width, height) {
            const padding = 25;

            for (let attempt = 0; attempt < 10000; attempt++) {
                const x =
                    padding +
                    Math.random() * (width - padding * 2);

                const y =
                    padding +
                    Math.random() * (height - padding * 2);

                if (pointMatchesSets(x, y, sets, circles)) {
                    return { x, y };
                }
            }

            return {
                x: width / 2,
                y: height / 2
            };
        }

        //helper to check if a position overlaps with existing stones
        function overlapsExistingStone(position, positions, minDistance = 32) {
            return positions.some(existing => {
                const dx = position.x - existing.x;
                const dy = position.y - existing.y;

                return Math.sqrt(dx * dx + dy * dy) < minDistance;
            });
        }

        function findStonePosition(
            sets,
            circles,
            width,
            height,
            existingPositions
        ) {
            const padding = 25;

            for (let attempt = 0; attempt < 5000; attempt++) {
                const x =
                    padding +
                    Math.random() * (width - padding * 2);

                const y =
                    padding +
                    Math.random() * (height - padding * 2);

                const position = { x, y };

                if (
                    pointMatchesSets(x, y, sets, circles) &&
                    !overlapsExistingStone(
                        position,
                        existingPositions
                    )
                ) {
                    return position;
                }
            }
            return null;
        }

        function getRunestones(region, period) {
            if (!vennData) {
                return {
                    venn: [],
                    outside: []
                };
            }

            const regionMap = {
                vastra: 'Västergötland',
                ostra: 'Östergötland'
            };
            const backendRegion = regionMap[region];
            const selectedPeriod = vennData[backendRegion]?.[`Period ${period}`] || {venn: [], outside: []};
            const unknownPeriod =
                vennData[backendRegion]?.['unknown'] || {
                    venn: [],
                    outside: []
                };

            const normalStones = selectedPeriod.venn.map(stone => ({
                ...stone,
                isUnknown: false
            }));

            const unknownStones = unknownPeriod.venn.map(stone => ({
                ...stone,
                isUnknown: true
            }));

            const outsideStones = [
                ...(selectedPeriod.outside || []).map(stone => ({
                    ...stone,
                    isUnknown: false
                })),

                ...(unknownPeriod.outside || []).map(stone => ({
                    ...stone,
                    isUnknown: true
                }))
            ];

            return {
                venn: [
                    ...normalStones,
                    ...unknownStones
                ],

                outside: outsideStones
            };

        }

        function addRunestones(svg, stones, circles, width, height) {
            const positions = [];
            const markerSize = 18;

            const params = new URLSearchParams(window.location.search);
            const selectedId = params.get('q')?.split('/')[0];

            // hover tooltip for runestones
            const tooltip = svg.append('g')
                .attr('class', 'runestone-tooltip')
                .style('display', 'none')

            tooltip.append('rect')
                .attr('rx', 4)
                .attr('ry', 4);

            tooltip.append('text')
                .attr('x', 10)
                .attr('y', 20);

            stones.forEach(stone => {
                const position = findStonePosition(
                    stone.sets,
                    circles,
                    width,
                    height,
                    positions
                );

                if (!position) {
                    return;
                }

                positions.push(position);

                const group = svg.append('g')
                    .attr('class', 'runestone')
                    .attr('data-id', stone.id)
                    .attr(
                        'data-unknown',
                        stone.isUnknown ? 'true' : 'false'
                    )
                    .attr(
                        'transform',
                        `translate(${position.x}, ${position.y})`
                    )
                    .on('mouseenter', function () {
                        const text = tooltip.select('text');

                        text.text(stone.name || stone.id);

                        const bbox = text.node().getBBox();

                        tooltip.select('rect')
                            .attr('width', bbox.width + 20)
                            .attr('height', bbox.height + 12)
                            .attr('x', 0)
                            .attr('y', 2);

                        tooltip
                            .attr(
                                'transform',
                                `translate(
                                    ${position.x + markerSize / 2 + 8},
                                    ${position.y - 14}
                                )`
                            )
                            .style('display', null);

                        tooltip.raise();
                    })
                    .on('mouseleave', function () {
                        tooltip.style('display', 'none');
                    })
                    .on('click', function () {
                        selectRunestone(stone);
                    });

                group.append('rect')
                    .attr('x', -markerSize / 2)
                    .attr('y', -markerSize / 2)
                    .attr('width', markerSize)
                    .attr('height', markerSize)
                    .attr('fill', () => {
                        if (String(stone.id) === String(selectedId)) {
                            return STONE_COLORS.selected;
                        }

                        if (stone.isUnknown) {
                            return STONE_COLORS.unknown;
                        }

                        return STONE_COLORS.normal;
                    });
            });
        }

        //helper to find position of outside venn circles
        function findOutsideStonePosition(
            circles,
            width,
            height,
            existingPositions
        ) {
            const padding = 20;
            const minOffset = 25;
            const maxOffset = 70;

            const circleList = Object.values(circles);

            for (let attempt = 0; attempt < 5000; attempt++) {
                // Pick one of the circles randomly
                const circle =
                    circleList[
                        Math.floor(Math.random() * circleList.length)
                    ];

                // Random angle around that circle
                const angle = Math.random() * Math.PI * 2;

                // Random distance just outside its edge
                const offset =
                    minOffset +
                    Math.random() * (maxOffset - minOffset);

                const distance = circle.r + offset;

                const x =
                    circle.x +
                    Math.cos(angle) * distance;

                const y =
                    circle.y +
                    Math.sin(angle) * distance;

                const position = { x, y };

                // Keep it inside the SVG
                if (
                    x < padding ||
                    x > width - padding ||
                    y < padding ||
                    y > height - padding
                ) {
                    continue;
                }

                // Must be outside ALL circles
                const outsideAllCircles =
                    circleList.every(otherCircle => {
                        const dx = x - otherCircle.x;
                        const dy = y - otherCircle.y;

                        const distanceToCircle =
                            Math.sqrt(dx * dx + dy * dy);

                        return distanceToCircle >
                            otherCircle.r + 10;
                    });

                if (!outsideAllCircles) {
                    continue;
                }

                // Avoid overlapping other outside stones
                if (
                    overlapsExistingStone(
                        position,
                        existingPositions,
                        32
                    )
                ) {
                    continue;
                }

                return position;
            }

            return null;
        }

        function addOutsideRunestones(svg, stones, circles, width, height) {
            const markerSize = 18;
            const positions = [];

            const params = new URLSearchParams(window.location.search);
            const selectedId = params.get('q')?.split('/')[0];

            stones.forEach(stone => {
                const position = findOutsideStonePosition(
                    circles,
                    width,
                    height,
                    positions
                );

                if (!position) {
                    return;
                }

                positions.push(position);

                const group = svg.append('g')
                    .attr('class', 'runestone outside-runestone')
                    .attr('data-id', stone.id)
                    .attr('data-unknown', 'true')
                    .attr(
                        'transform',
                        `translate(${position.x}, ${position.y})`
                    )
                    .on('click', function (event) {
                        event.stopPropagation();
                        selectRunestone(stone);
                    });

                group.append('rect')
                    .attr('x', -markerSize / 2)
                    .attr('y', -markerSize / 2)
                    .attr('width', markerSize)
                    .attr('height', markerSize)
                    .attr(
                        'fill',
                        String(stone.id) === String(selectedId)
                            ? STONE_COLORS.selected
                            : STONE_COLORS.unknown
                    );
            });
        }

        function renderVenn() {
            const diagram = document.getElementById('venn-diagram');
            diagram.innerHTML = '';

            const width = diagram.clientWidth;
            const height = diagram.clientHeight;

            const svg = d3
                .select('#venn-diagram')
                .append('svg')
                .attr('viewBox', `0 0 ${width} ${height}`)

            const circles = getCircleGeometry(width, height);

            drawCircles(svg, circles);

            addVennLabels(svg, circles);

            const stones = getRunestones(
                activeRegion,
                activePeriod
            );

            addRunestones(
                svg,
                stones.venn,
                circles,
                width,
                height
            );

            addOutsideRunestones(
                svg,
                stones.outside,
                circles,
                width,
                height
                
            );
        }

        
        async function selectRunestone(stone) {
            const url = new URL(window.location.href);
            url.searchParams.set('q', stone.id);
            window.history.pushState({}, '', url);
            //check what viewer
            await updateViewerAvailability(stone.id);
            changeRightViewer('metadata');
            // show right pane on mobile
            document
                .getElementById('main-content')
                .classList.add('mobile-metadata-open');

            //show the navigation bar
            document.getElementById('nav-bar').style.display = 'block';

            // Restore each stone's normal color
            d3.selectAll('.runestone').each(function () {
                const group = d3.select(this);

                const isUnknown =
                    group.attr('data-unknown') === 'true';

                group.select('rect')
                    .attr(
                        'fill',
                        isUnknown
                            ? STONE_COLORS.unknown
                            : STONE_COLORS.normal
                    );
            });

            // Selected rune
            d3.select(
                `.runestone[data-id="${stone.id}"] rect`)
                .on('click', function (event) {
                    event.stopPropagation();
                    selectRunestone(stone);
                })
                .attr('fill', STONE_COLORS.selected);
        }

        function changeLeftViewer() {
            const leftIframe = document.getElementById('left-iframe');
            const leftPlaceholder = document.getElementById('left-placeholder');

            leftIframe.removeAttribute('src');
            leftIframe.style.display = 'none';
            leftPlaceholder.style.display = 'flex';

            renderVenn()
            moduleSwitcherLeft();
        }

        function moduleSwitcherLeft() {
            $('.left').css('opacity', '0.6');
            $(`#region-${activeRegion === 'vastra' ? 'west' : 'east'}`).css('opacity', '1');
            $('.period').css('opacity', '0.6');
            $(`#period-${activePeriod}`).css('opacity', '1');
        }

        function moduleSwitcherRight() {
            $('.right').css('opacity', '0.6');
            $(`#viewer-${activeViewer}`).css('opacity', '1');
        }

        function clearSelectedRunestone() {
            // Remove q from URL
            const url = new URL(window.location.href);
            url.searchParams.delete('q');

            // Hide the navigation bar
            document.getElementById('nav-bar').style.display = 'none';

            document.getElementById('viewer-images')
                .style.display = 'none';
            document.getElementById('viewer-texturedmesh')
                .style.display = 'none';

            window.history.pushState(
                {},
                '',
                url.pathname
            );

            // Restore colors in the Venn diagram
            d3.selectAll('.runestone').each(function () {
                const group = d3.select(this);

                const isUnknown =
                    group.attr('data-unknown') === 'true';

                group.select('rect')
                    .attr(
                        'fill',
                        isUnknown
                            ? '#999'
                            : '#ffc76a'
                    );
            });

            // Reset right viewer to empty metadata page
            activeViewer = 'metadata';

            const iframe =
                document.getElementById('right-iframe');

            iframe.src =
                '/viewer/projects/runes/metadata/metadata.html';

            moduleSwitcherRight();
        }

        //this function checks which viewer is loaded when routing directly to iiif/image/context etc, since metadata.html isnt loaded there
        async function updateViewerAvailability(runeId) {
            const imageButton =  document.getElementById('viewer-images');
            const meshButton = document.getElementById('viewer-texturedmesh');

            if (!runeId) {
                imageButton.style.display = 'none';
                meshButton.style.display = 'none';
                return;
            }

            // metadata is needed to check mesh availability
            try {
                const response = await fetch(
                    `https://runes.dh.gu.se/api/metadata/${encodeURIComponent(runeId)}`
                );
                if (response.ok) {
                    const rune = await response.json();
                    meshButton.style.display =
                        rune.mesh_url_public ? '' : 'none';
                } else {
                    meshButton.style.display = 'none';
                }
            } catch (error) {
                console.error('Could not check mesh availability:', error);
                meshButton.style.display = 'none';
            }
            // check image availability
            try {
                const response = await fetch(
                    `https://runes.dh.gu.se/api/image/?place=${encodeURIComponent(runeId)}`
                );

                if (!response.ok) {
                    imageButton.style.display = 'none';
                    return;
                }

                const data = await response.json();

                const images = Array.isArray(data)
                    ? data
                    : data.results || [];

                const hasImages = images.some(
                    image => image.iiif_file
                );

                imageButton.style.display =
                    hasImages ? '' : 'none';

            } catch (error) {
                console.error('Could not check image availability:', error);
                imageButton.style.display = 'none';
            }
        }
    </script>
</body>

</html>
