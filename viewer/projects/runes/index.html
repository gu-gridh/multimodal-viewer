<!DOCTYPE html>
<html lang="sv" data-project="runes">

<head>
    <title>Runes</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="/viewer/shared/barlow_font.css" rel="stylesheet">
    <link href="/viewer/shared/oswald_font.css" rel="stylesheet">
    <link rel="stylesheet" href="/viewer/shared/shared_styles.css">
    <link rel="stylesheet" href="/viewer/shared/split-layout.css">
    <script src="/viewer/modules/pointcloud/libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/venn.js@0.2.20/build/venn.js"></script>   
    <style>
        html,
        body {
            width: 100vw;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--viewer-bg);
            font-family: "Oswald", sans-serif;
        }

        #main-content {
            height: 100% !important;
        }

        #left-pane {
            width: 70%;
            position: relative;
        }

        #right-pane {
            width: 30%;
            background: rgb(228, 228, 220);
        }

        .module-placeholder {
            height: 100%;
            display: none;
            align-items: stretch;
            justify-content: stretch;
            color: #111;
            font-weight: 300;
        }

        .period-switcher {
            position: absolute;
            bottom: 28px;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: center;
        }

        .period-switcher .ui-module {
            position: static;
            display: flex;
        }

        .iframes {
            width: 100%;
            border: 0;
        }

        .mobile-metadata-tab,
        .mobile-back-button {
            display: none;
        }

        .venn-panel {
            position: absolute;
            top: 120px;
            left: 20px;
            right: 20px;
            bottom: 90px;
        }

        .venn-panel h2 {
            margin: 0 0 20px;
            font-weight: 300;
            font-size: 28px;
        }

        #venn-diagram {
            width: 100%;
            height: 100%;
        }

        #venn-diagram svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #venn-diagram text {
            fill: white;
        }

        #venn-diagram .venn-area path {
            fill: none !important;
            fill-opacity: 0 !important;
            stroke: #999;
            stroke-width: 2px;
        }

        .venn-label {
            font-size: 20px;
            font-weight: 400;
        }

        .runestone {
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .runestone:hover {
            opacity: 0.7;
        }

        .runestone-label {
            font-size: 16px;
            dominant-baseline: middle;
        }

        @media screen and (max-width: 1050px) {

            #left-pane,
            #right-pane {
                display: block;
                width: 50%;
            }

            .ui-module-container {
                width: 50vw;
            }
        }

        @media screen and (max-width: 1050px) {
            #main-content {
                overflow: hidden;
            }

            #left-pane,
            #right-pane {
                width: 100%;
            }

            .ui-module-container {
                width: 100vw;
            }

            #right-pane {
                display: none;
            }

            #main-content.mobile-metadata-open #left-pane {
                display: none;
            }

            #main-content.mobile-metadata-open #right-pane {
                display: block;
            }

            .mobile-metadata-tab {
                display: block;
            }

            .mobile-back-button {
                position: absolute;
                display: block;
                width: 30px;
                height: 30px;
                top: 28px;
                left: 12px;
                border-radius: 50%;
                background: #000 url(https://data.dh.gu.se/ui-icons/arrow_back_white.png) center / 15px no-repeat;
                z-index: 1100;
                cursor: pointer;
            }
        }
    </style>
</head>

<body>
    <div id="main-content">
        <div id="left-pane">
            <div class="ui-module-container">
                <div class="ui-module">
                    <div class="ui-module-item left" id="region-west" onclick="changeRegion('vastra')">Västra Götaland
                    </div>
                    <div class="ui-module-item left" id="region-east" onclick="changeRegion('ostra')">Östra Götaland
                    </div>
                    <div class="ui-module-item left mobile-metadata-tab" onclick="showMobileMetadata()">About</div>
                </div>
            </div>
            <div id="left-placeholder" class="module-placeholder">
                <div class="venn-panel">
                    <div id="venn-diagram"></div>
                </div>
            </div>
            <iframe id="left-iframe" class="iframes" title="Region"></iframe>
            <div class="period-switcher">
                <div class="ui-module">
                    <div class="ui-module-item period" id="period-1" onclick="changePeriod('1')">Period 1</div>
                    <div class="ui-module-item period" id="period-2" onclick="changePeriod('2')">Period 2</div>
                </div>
            </div>
        </div>

        <div id="right-pane">
            <div class="mobile-back-button" title="Back to visuals" onclick="showMobileVisuals()"></div>
            <div class="ui-module-container">
                <div class="ui-module">
                    <div class="ui-module-item right" id="viewer-metadata" onclick="changeRightViewer('metadata')">
                        Metadata</div>
                    <div class="ui-module-item right" id="viewer-model" onclick="changeRightViewer('model')">3D Model
                    </div>
                    <div class="ui-module-item right" id="viewer-panorama" onclick="changeRightViewer('panorama')">
                        Panorama</div>
                </div>
            </div>
            <iframe id="right-iframe" class="iframes" title="Rune content"></iframe>
            <div id="right-placeholder" class="module-placeholder"></div>
        </div>

    </div>

    <script>
        let activeRegion = 'vastra';
        let activeViewer = 'metadata';
        let activePeriod = '1';

        $(document).ready(function () {
            const params = new URLSearchParams(window.location.search);
            const region = params.get('region');
            activeRegion = ['vastra', 'ostra'].includes(region) ? region : activeRegion;
            changeLeftViewer();
            changeRightViewer(activeViewer);
        });

        function changeRegion(region) {
            activeRegion = region;
            changeLeftViewer();
        }

        function showMobileMetadata() {
            changeRightViewer('metadata');
            document.getElementById('main-content').classList.add('mobile-metadata-open');
        }

        function showMobileVisuals() {
            document.getElementById('main-content').classList.remove('mobile-metadata-open');
        }

        function changeRightViewer(viewer) {
            activeViewer = viewer;
            const params = new URLSearchParams(window.location.search);
            const query = new URLSearchParams({
                region: activeRegion,
                period: activePeriod,
                q: params.get('q') || ''
            });
            const rightIframe = document.getElementById('right-iframe');
            const rightPlaceholder = document.getElementById('right-placeholder');

            if (activeViewer === 'metadata') {
                rightIframe.src = `/viewer/projects/runes/metadata/metadata.html?${query}`;
                rightIframe.style.display = 'block';
                rightPlaceholder.style.display = 'none';
            } else {
                const objectId = (params.get('q') || '1').split('/')[0];
                rightIframe.src = activeViewer === 'model'
                    ? `/viewer/modules/texturedmesh/texturedmesh.html?q=${encodeURIComponent(objectId)}/texturedmesh`
                    : '/viewer/modules/panorama/panorama.html';
                rightIframe.style.display = 'block';
                rightPlaceholder.style.display = 'none';
            }

            moduleSwitcherRight();
        }

        function changePeriod(period) {
            activePeriod = period;
            changeLeftViewer();
        }

        function getVennData(region, period) {
            // Mock data
            if (region === 'vastra' && period === '1') {
                return [
                    { sets: ['Väg'], size: 40 },
                    { sets: ['Gravfält'], size: 32 },
                    { sets: ['Gräns'], size: 24 },

                    { sets: ['Väg', 'Gravfält'], size: 14 },
                    { sets: ['Väg', 'Gräns'], size: 8 },
                    { sets: ['Gravfält', 'Gräns'], size: 6 },

                    { sets: ['Väg', 'Gravfält', 'Gräns'], size: 3 }
                ];
            }

            if (region === 'vastra' && period === '2') {
                return [
                    { sets: ['Väg'], size: 32 },
                    { sets: ['Gravfält'], size: 26 },
                    { sets: ['Gräns'], size: 30 },

                    { sets: ['Väg', 'Gravfält'], size: 10 },
                    { sets: ['Väg', 'Gräns'], size: 15 },
                    { sets: ['Gravfält', 'Gräns'], size: 8 },

                    { sets: ['Väg', 'Gravfält', 'Gräns'], size: 5 }
                ];
            }

            if (region === 'ostra' && period === '1') {
                return [
                    { sets: ['Väg'], size: 30 },
                    { sets: ['Gravfält'], size: 38 },
                    { sets: ['Gräns'], size: 20 },

                    { sets: ['Väg', 'Gravfält'], size: 16 },
                    { sets: ['Väg', 'Gräns'], size: 5 },
                    { sets: ['Gravfält', 'Gräns'], size: 7 },

                    { sets: ['Väg', 'Gravfält', 'Gräns'], size: 2 }
                ];
            }

            return [
                { sets: ['Väg'], size: 35 },
                { sets: ['Gravfält'], size: 28 },
                { sets: ['Gräns'], size: 25 },

                { sets: ['Väg', 'Gravfält'], size: 12 },
                { sets: ['Väg', 'Gräns'], size: 10 },
                { sets: ['Gravfält', 'Gräns'], size: 9 },

                { sets: ['Väg', 'Gravfält', 'Gräns'], size: 4 }
            ];
        }

        //mock data for runestones in each region and period
        function getMockRunestones(region, period) {
            const variations = {
                'vastra-1': [
                    { id: 'r1', sets: ['Väg'] },
                    { id: 'r2', sets: ['Väg'] },

                    { id: 'r3', sets: ['Väg', 'Gravfält'] },
                    { id: 'r4', sets: ['Väg', 'Gravfält'] },
                    { id: 'r5', sets: ['Väg', 'Gravfält'] },
                    { id: 'r6', sets: ['Väg', 'Gravfält'] },
                    { id: 'r7', sets: ['Väg', 'Gravfält'] },

                    { id: 'r8', sets: ['Väg', 'Gräns'] },
                    { id: 'r9', sets: ['Väg', 'Gräns'] },
                    { id: 'r10', sets: ['Väg', 'Gräns'] },
                    { id: 'r11', sets: ['Väg', 'Gräns'] },

                    { id: 'r12', sets: ['Väg', 'Gravfält', 'Gräns'] },
                    { id: 'r13', sets: ['Väg', 'Gravfält', 'Gräns'] },

                    { id: 'r14', sets: ['Gravfält'] },

                    {
                        id: 'r15',
                        sets: ['Gräns'],
                        selected: true,
                        title: 'Title'
                    }
                ],

                'vastra-2': [
                    { id: 'r1', sets: ['Väg'] },
                    { id: 'r2', sets: ['Väg', 'Gravfält'] },
                    { id: 'r3', sets: ['Väg', 'Gravfält'] },
                    { id: 'r4', sets: ['Väg', 'Gräns'] },
                    { id: 'r5', sets: ['Väg', 'Gräns'] },
                    { id: 'r6', sets: ['Väg', 'Gräns'] },
                    { id: 'r7', sets: ['Gravfält'] },
                    { id: 'r8', sets: ['Gräns'] },
                    { id: 'r9', sets: ['Väg', 'Gravfält', 'Gräns'] }
                ],

                'ostra-1': [
                    { id: 'r1', sets: ['Väg'] },
                    { id: 'r2', sets: ['Gravfält'] },
                    { id: 'r3', sets: ['Gravfält'] },
                    { id: 'r4', sets: ['Väg', 'Gravfält'] },
                    { id: 'r5', sets: ['Väg', 'Gravfält'] },
                    { id: 'r6', sets: ['Väg', 'Gräns'] },
                    { id: 'r7', sets: ['Gravfält', 'Gräns'] },
                    { id: 'r8', sets: ['Väg', 'Gravfält', 'Gräns'] }
                ],

                'ostra-2': [
                    { id: 'r1', sets: ['Väg'] },
                    { id: 'r2', sets: ['Väg'] },
                    { id: 'r3', sets: ['Gräns'] },
                    { id: 'r4', sets: ['Väg', 'Gräns'] },
                    { id: 'r5', sets: ['Gravfält', 'Gräns'] },
                    { id: 'r6', sets: ['Väg', 'Gravfält', 'Gräns'] }
                ]
            };

            return variations[`${region}-${period}`] || [];
        }

        //mock positions for the runestones
        function getRunestonePosition(sets, index, width, height) {
            const key = [...sets].sort().join('|');

            const positions = {
                'Väg': {
                    x: width * 0.50,
                    y: height * 0.25
                },

                'Gravfält': {
                    x: width * 0.27,
                    y: height * 0.67
                },

                'Gräns': {
                    x: width * 0.73,
                    y: height * 0.67
                },

                'Gravfält|Väg': {
                    x: width * 0.40,
                    y: height * 0.47
                },

                'Gräns|Väg': {
                    x: width * 0.60,
                    y: height * 0.47
                },

                'Gravfält|Gräns': {
                    x: width * 0.50,
                    y: height * 0.67
                },

                'Gravfält|Gräns|Väg': {
                    x: width * 0.50,
                    y: height * 0.55
                }
            };

            const base = positions[key] || {
                x: width / 2,
                y: height / 2
            };

            /*
            * Simple deterministic spread around each region.
            * This avoids stacking all stones on top of each other.
            */
            const columns = 4;
            const spacing = 34;

            const col = index % columns;
            const row = Math.floor(index / columns);

            return {
                x: base.x + (col - 1.5) * spacing,
                y: base.y + row * spacing
            };
        }

        function renderVenn() {
            const diagram = document.getElementById('venn-diagram');

            if (!diagram) {
                return;
            }

            diagram.innerHTML = '';

            const width = diagram.clientWidth;
            const height = diagram.clientHeight;

            const vennData = [
                { sets: ['Väg'], size: 40 },
                { sets: ['Gravfält'], size: 40 },
                { sets: ['Gräns'], size: 40 },

                { sets: ['Väg', 'Gravfält'], size: 14 },
                { sets: ['Väg', 'Gräns'], size: 14 },
                { sets: ['Gravfält', 'Gräns'], size: 8 },

                { sets: ['Väg', 'Gravfält', 'Gräns'], size: 5 }
            ];

            const chart = venn.VennDiagram()
                .width(width)
                .height(height);

            const container = d3
                .select('#venn-diagram')
                .datum(vennData)
                .call(chart);

            const svg = container.select('svg');

            /*
            * We only want venn.js for the circle geometry,
            * so remove its automatically generated text.
            */
            svg.selectAll('text').remove();

            svg.selectAll('.venn-area path')
                .style('fill', 'none')
                .style('fill-opacity', 0)
                .style('stroke', '#999')
                .style('stroke-width', '2px');

            /*
            * Custom labels matching the mockup.
            */
            svg.append('text')
                .attr('class', 'venn-label')
                .attr('x', width * 0.50)
                .attr('y', 30)
                .attr('text-anchor', 'middle')
                .text('Väg');

            svg.append('text')
                .attr('class', 'venn-label')
                .attr('x', 0)
                .attr('y', height * 0.64)
                .attr('text-anchor', 'start')
                .text('Gravfält');

            svg.append('text')
                .attr('class', 'venn-label')
                .attr('x', width)
                .attr('y', height * 0.64)
                .attr('text-anchor', 'end')
                .text('Gräns');

            const runestones = getMockRunestones(
                activeRegion,
                activePeriod
            );

            /*
            * Track how many stones have already been placed
            * inside each combination.
            */
            const combinationIndexes = {};

            runestones.forEach(stone => {
                const key = [...stone.sets].sort().join('|');

                const index = combinationIndexes[key] || 0;
                combinationIndexes[key] = index + 1;

                const position = getRunestonePosition(
                    stone.sets,
                    index,
                    width,
                    height
                );

                const markerSize = 24;

                const group = svg
                    .append('g')
                    .attr('class', 'runestone')
                    .attr(
                        'transform',
                        `translate(${position.x}, ${position.y})`
                    )
                    .on('click', () => {
                        selectRunestone(stone);
                    });

                group.append('rect')
                    .attr('x', -markerSize / 2)
                    .attr('y', -markerSize / 2)
                    .attr('width', markerSize)
                    .attr('height', markerSize)
                    .attr(
                        'fill',
                        stone.selected
                            ? '#ffa500'
                            : '#ffc76a'
                    );

                if (stone.selected && stone.title) {
                    group.append('text')
                        .attr('class', 'runestone-label')
                        .attr('x', markerSize / 2 + 8)
                        .attr('y', 1)
                        .attr('text-anchor', 'start')
                        .text(stone.title);
                }
            });
        }

        //TODO: on runestone select
        function selectRunestone(stone) {
            console.log('Selected runestone:', stone);
        }

        function changeLeftViewer() {
            const leftIframe = document.getElementById('left-iframe');
            const leftPlaceholder = document.getElementById('left-placeholder');

            leftIframe.removeAttribute('src');
            leftIframe.style.display = 'none';
            leftPlaceholder.style.display = 'flex';

            renderVenn()
            moduleSwitcherLeft();
        }

        function moduleSwitcherLeft() {
            $('.left').css('opacity', '0.6');
            $(`#region-${activeRegion === 'vastra' ? 'west' : 'east'}`).css('opacity', '1');
            $('.period').css('opacity', '0.6');
            $(`#period-${activePeriod}`).css('opacity', '1');
        }

        function moduleSwitcherRight() {
            $('.right').css('opacity', '0.6');
            $(`#viewer-${activeViewer}`).css('opacity', '1');
        }
    </script>
</body>

</html>
