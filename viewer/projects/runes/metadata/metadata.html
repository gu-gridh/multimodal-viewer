        //mock data for testing
        const mockRune = {
            id: 'r1',
            title: 'Runsten R1',
            lat: 58.3908,
            lng: 13.8451
        };

        const map = L.map('map').setView(
            [mockRune.lat, mockRune.lng],
            11
        );

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

            .addTo(map)
            .bindPopup(mockRune.title)
