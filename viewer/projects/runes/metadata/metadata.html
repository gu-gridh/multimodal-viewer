<!DOCTYPE html>
<html lang="sv">

<head>
    <title>Metadata</title>
    <meta charset="utf-8">
    <link href="/viewer/shared/oswald_font.css" rel="stylesheet">
    <link rel="stylesheet" href="/viewer/shared/shared_styles.css">
    <link rel="stylesheet" href="metadata.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="/viewer/libs/openseadragon.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div class="metadata-container">
        <div id="start" class="start">
            Välj en runsten för att visa information. Lorum ipsum bla bla bla.
        </div>
        <div id="metadata-content-wrapper" style="display: none;">
        <div class="metadata-card">
            <div class="metadata-content">
                <div class="metadata-title" id="metadata-title"></div>
            </div>
            <div class="metadata-content">
                <div class="label">Beskrivning</div>
                <p class="metadata-description" id="metadata-description"></p>
            </div>
            <div class="metadata-content">
                <div class="label">Datum</div>
                <div class="data" id="metadata-date"></div>
            </div>
            <div class="metadata-content">
                <div class="label">Fornfynd</div>
                <div class="data" id="metadata-fornfynd"></div>
            </div>
            <div class="metadata-content">
                <div class="label">Lantmäteriet</div>
                <div class="data" id="metadata-lantmateriet"></div>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        async function loadMetadata() {
        const params = new URLSearchParams(window.location.search);
        const runeId = params.get('q');
        const emptyState = document.getElementById('start');
        const content = document.getElementById('metadata-content-wrapper');

        if (!runeId) {
            emptyState.style.display = 'block';
            content.style.display = 'none';
            return;
        }

        emptyState.style.display = 'none';
        content.style.display = 'block';
        
        try {
            const response = await fetch(`https://runes.dh.gu.se/api/metadata/${runeId}`);
            //const response = await fetch(`/api/runes/metadata/${runeId}`);
            if (!response.ok) {
                throw new Error(
                    `Metadata request failed: ${response.status}`
                );
            }

            const rune = await response.json();
            console.log('Rune metadata:', rune);

            document.getElementById('metadata-title').textContent =
                rune.name || '';

            document.getElementById('metadata-description').textContent =
                rune.description || '';

            document.getElementById('metadata-date').textContent =
                rune.date_visit || '';

            setLink(
                'metadata-fornfynd',
                rune.fornsoek_url,
                'Öppna Fornfynd'
            );

            setLink(
                'metadata-lantmateriet',
                rune.lantmaeteriet_url,
                'Öppna Lantmäteriet'
            );

        } catch (error) {
            console.error('Could not load metadata:', error);
        }
    }

        function setLink(elementId, url, text) {
            const element = document.getElementById(elementId);

                if (!url) {
                    element.textContent = '';
                    return;
                }

                const link = document.createElement('a');

                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = text;

                element.replaceChildren(link);
            }

        loadMetadata();

        //mock for map
        const mockRune = {
            id: 'r1',
            title: 'Runsten R1',
            lat: 58.3908,
            lng: 13.8451
        };

        const map = L.map('map').setView(
            [mockRune.lat, mockRune.lng],
            11
        );

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        L.marker([mockRune.lat, mockRune.lng])
            .addTo(map)
            .bindPopup(mockRune.title)
            .openPopup();


    </script>
</body>

</html>
